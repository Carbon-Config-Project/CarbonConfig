plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147' 
    id 'net.darkhax.curseforgegradle' version '1.1.15'
    id 'com.modrinth.minotaur' version '2.+'
}
version = MC_VERSION + '-' + MOD_VERSION
group = 'carbonconfiglib' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
base.archivesName = 'CarbonConfig-Neoforge'



java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java {
 			srcDir "carbonconfig/src/main/java"
 			srcDir "src/main/java"
 		}
    }
}
neoForge {
	version = "26.3.0.99"
	runs {
    	configureEach {
   		     //Required for JIJ iirc.
			dependencies {
    			implementation ':Primitive Collections-0.8.9'
    		}
    	}
    	client {
    		client()
    	}
    	server {
    		server()
    	}
	}
	mods {
		"carbonconfig" {
			sourceSet(sourceSets.main)
		}
	}
	unitTest {
        enable()
        testedMod = mods.carbonconfig
    }
}



sourceSets.main.resources { srcDir 'src/generated/resources' }


repositories {
    mavenLocal()
	maven {
        url = "https://www.cursemaven.com"
    }
    maven {
 		url = "https://maven.blamejared.com"
	}
    flatDir {
       dirs("libs")
   	}
}

dependencies {
	implementation ':Primitive Collections-0.8.9'
	implementation "curse.maven:jei-238222:9453343"
	implementation "net.mezzdev.config:mezz_config-26.3-neoforge:0.6.11"
	jarJar(implementation('com.github.Speiger:Primitive Collections:0.8.9')) {
        version {
            strictly '[0.8,0.9)'
            prefer '0.8.9'
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

test {
	exclude 'carbonconfiglib/**'
}

tasks.named('jar', Jar) {
    eachFile { fcd ->
        if (fcd.relativePath.pathString.startsWith("assets/carbonconfig/lang/") && !fcd.name.endsWith(".json")) {
            fcd.exclude()
        }
    }
    
    doLast {
        def jarFile = archiveFile.get().asFile
        if (jarFile.name.contains("-all")) {
            def newJar = new File(jarFile.parent, jarFile.name.replace("-all", ""))
            if (newJar.exists()) newJar.delete()
            jarFile.renameTo(newJar)
        }
    }
}

task publishMods() {
	group = 'publishing'
	description = 'Publishes the mod to all Mod Distributors'
	doLast {
		System.out.println("Published Mods to Curseforge/Modrinth")
	}
}
publishMods.dependsOn('modrinth')
publishMods.dependsOn('curseforge')

modrinth {
	token = System.getenv("Modrinth_API_Token");
	projectId = 'carbon-config'
	versionName = base.archivesName.get().replace(" ", "")+"-"+version
	versionNumber = MOD_VERSION
	versionType = RELEASE_TYPE
	uploadFile = jar
	gameVersions = [MC_VERSION]
	loaders = ['neoforge']
	
    def logs = new File(projectDir, "/changelogs/"+MOD_VERSION.replace(".", "")+".md");
    changelog = logs.exists() ? logs.getText('UTF-8') : "";
}

task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) { 
	mustRunAfter assemble
	group = 'publishing'
	description = 'Publishes the mod to Curseforge'
	apiToken = System.getenv("Curseforge_API_Token")
		
	def mainFile = upload(898104, jar)
    mainFile.releaseType = RELEASE_TYPE
    mainFile.displayName = base.archivesName.get().replace(" ", "")+"-"+version
    
    def changelog = new File(projectDir, "/changelogs/"+MOD_VERSION.replace(".", "")+".md");
    mainFile.changelog = changelog.exists() ? changelog.getText('UTF-8') : "";
    mainFile.changelogType = 'markdown'
    mainFile.addGameVersion(MC_VERSION, 'Server', 'Client')
    mainFile.addJavaVersion('Java 25')
	mainFile.addModLoader('NeoForge')
}